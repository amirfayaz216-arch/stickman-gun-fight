<!DOCTYPE html> <html lang="fa"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"> <title>Stickman Gun Fight</title> <style> *{box-sizing:border-box;touch-action:none} body{margin:0;background:#101827;color:white;font-family:Arial;overflow:hidden} #game{display:block;width:100vw;height:100vh;background:#182b40} #ui{position:fixed;top:8px;left:0;width:100%;display:flex;justify-content:space-around;font-weight:bold} .hp{background:#333;width:100px;height:12px;border-radius:10px;overflow:hidden} .fill{height:100%;background:#42e875;width:100%} .controls{position:fixed;bottom:12px;display:grid;gap:8px} .left{left:12px}.right{right:12px} button{border:2px solid #ffffff55;border-radius:15px;background:#ffffff20;color:white;font-size:20px;font-weight:bold;min-width:55px;min-height:48px} #menu{position:fixed;inset:0;background:#101827dd;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px} #menu h1{color:#54e6ff} #menu button{padding:12px 28px;background:#1266a5} </style> </head> <body> <canvas id="game"></canvas> <div id="ui"> <div>بازیکن ۱ <div class="hp"><div id="hp1" class="fill"></div></div></div> <div id="status">آماده نبرد!</div> <div>بازیکن ۲ <div class="hp"><div id="hp2" class="fill"></div></div></div> </div> <div class="controls left"> <div><button data-p="1" data-a="left">◀</button><button data-p="1" data-a="right">▶</button></div> <button data-p="1" data-a="jump">⬆ پرش</button> <button data-p="1" data-a="fire">🔫 شلیک</button> </div> <div class="controls right"> <div><button data-p="2" data-a="left">◀</button><button data-p="2" data-a="right">▶</button></div> <button data-p="2" data-a="jump">⬆ پرش</button> <button data-p="2" data-a="fire">🔫 شلیک</button> </div> <div id="menu"> <h1>STICKMAN GUN FIGHT</h1> <p>نبرد دونفره روی یک گوشی!</p> <button id="start">شروع بازی 🎮</button> <p>بازیکن اول آبی | بازیکن دوم قرمز</p> </div> <script> const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'); let W,H,playing=false,bullets=[],guns=[],last=0; function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight} addEventListener('resize',resize);resize(); let P=[]; function reset(){ P=[ {x:W*.2,y:H*.65,vx:0,vy:0,hp:100,c:'#37cfff',dir:1,gun:false,on:false}, {x:W*.8,y:H*.65,vx:0,vy:0,hp:100,c:'#ff5364',dir:-1,gun:false,on:false} ]; bullets=[];guns=[{x:W*.42,y:-20},{x:W*.58,y:-100}]; document.getElementById('status').textContent='اسلحه‌ها در راه‌اند!'; } const keys={}; document.querySelectorAll('button[data-p]').forEach(b=>{ const id=+b.dataset.p-1,a=b.dataset.a; const down=e=>{e.preventDefault();keys[id+a]=true}; const up=e=>{e.preventDefault();keys[id+a]=false}; b.addEventListener('pointerdown',down); b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('pointerleave',up); }); document.getElementById('start').onclick=()=>{reset();playing=true;document.getElementById('menu').style.display='none'}; function stick(p){ ctx.strokeStyle=p.c;ctx.lineWidth=5;ctx.lineCap='round'; ctx.beginPath();ctx.arc(p.x,p.y-30,10,0,Math.PI*2);ctx.stroke(); ctx.beginPath();ctx.moveTo(p.x,p.y-20);ctx.lineTo(p.x,p.y+12); ctx.moveTo(p.x,p.y-10);ctx.lineTo(p.x-12,p.y); ctx.moveTo(p.x,p.y-10);ctx.lineTo(p.x+12,p.y); ctx.moveTo(p.x,p.y+12);ctx.lineTo(p.x-10,p.y+28); ctx.moveTo(p.x,p.y+12);ctx.lineTo(p.x+10,p.y+28);ctx.stroke(); if(p.gun){ ctx.fillStyle='#ddd';ctx.fillRect(p.x+p.dir*8,p.y-15,p.dir*24,6); } } function update(dt){ if(!playing)return; let floor=H-55; P.forEach((p,i)=>{ if(keys[i+'left']){p.vx=-220;p.dir=-1} else if(keys[i+'right']){p.vx=220;p.dir=1} else p.vx*=.8; if(keys[i+'jump']&&p.on){p.vy=-430;p.on=false} p.vy+=1000*dt;p.x+=p.vx*dt;p.y+=p.vy*dt; p.x=Math.max(20,Math.min(W-20,p.x)); if(p.y+28>=floor){p.y=floor-28;p.vy=0;p.on=true} if(keys[i+'fire']&&p.gun&&Math.random()<.12){ bullets.push({x:p.x+p.dir*22,y:p.y-14,vx:p.dir*550,owner:i}); } }); guns.forEach(g=>{if(g.y<H-65)g.y+=180*dt}); guns.forEach(g=>P.forEach(p=>{ if(!p.gun&&Math.abs(p.x-g.x)<25&&Math.abs(p.y-g.y)<45){p.gun=true;g.y=H+100} })); bullets.forEach(b=>{ b.x+=b.vx*dt; P.forEach((p,i)=>{ if(i!==b.owner&&Math.abs(p.x-b.x)<18&&Math.abs(p.y-15-b.y)<30){ p.hp=Math.max(0,p.hp-10);b.dead=true; } }); if(b.x<0||b.x>W)b.dead=true; }); bullets=bullets.filter(b=>!b.dead); P.forEach((p,i)=>document.getElementById('hp'+(i+1)).style.width=p.hp+'%'); if(P.some(p=>p.hp<=0)){ playing=false; document.getElementById('status').textContent=P[0].hp<=0?'بازیکن ۲ برنده شد!':'بازیکن ۱ برنده شد!'; document.getElementById('menu').style.display='flex'; document.querySelector('#menu h1').textContent='پایان مسابقه!'; document.getElementById('start').textContent='بازی دوباره 🔄'; } } function draw(){ ctx.clearRect(0,0,W,H); let grad=ctx.createLinearGradient(0,0,0,H); grad.addColorStop(0,'#142b46');grad.addColorStop(1,'#28475b'); ctx.fillStyle=grad;ctx.fillRect(0,0,W,H); ctx.fillStyle='#526a70';ctx.fillRect(0,H-55,W,55); ctx.strokeStyle='#78959b';ctx.lineWidth=2; for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,H-55);ctx.lineTo(x+25,H);ctx.stroke()} guns.forEach(g=>{ if(g.y<H){ctx.fillStyle='#ffd447';ctx.fillRect(g.x-12,g.y-6,24,12); ctx.fillStyle='#fff';ctx.fillRect(g.x+2,g.y-3,15,5)} }); P.forEach(stick); bullets.forEach(b=>{ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill()}); } function loop(t){let dt=Math.min((t-last)/1000||0,.03);last=t;update(dt);draw();requestAnimationFrame(loop)} requestAnimationFrame(loop); </script> </body> </html>
