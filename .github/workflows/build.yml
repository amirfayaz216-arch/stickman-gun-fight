name: Build Stickman APK on: workflow_dispatch: push: branches: - main permissions: contents: read jobs: build: runs-on: ubuntu-latest steps: - name: Download project uses: actions/checkout@v4 - name: Set up Java uses: actions/setup-java@v4 with: distribution: temurin java-version: '17' - name: Set up Android SDK uses: android-actions/setup-android@v3 - name: Prepare project run: | mkdir -p app/src/main/assets mkdir -p app/src/main/java/com/stickman/game mkdir -p app/src/main/res/values cp index.html app/src/main/assets/index.html echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } } dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } } rootProject.name = "StickmanGunFight" include(":app")' > settings.gradle echo 'plugins { id "com.android.application" version "8.6.1" apply false }' > build.gradle echo 'plugins { id "com.android.application" } android { namespace "com.stickman.game" compileSdk 35 defaultConfig { applicationId "com.stickman.game" minSdk 23 targetSdk 28 versionCode 1 versionName "1.0" } }' > app/build.gradle echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"> <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="Stickman Gun Fight" android:usesCleartextTraffic="true"> <activity android:name=".MainActivity" android:screenOrientation="landscape" android:exported="true"> <intent-filter> <action android:name="android.intent.action.MAIN"/> <category android:name="android.intent.category.LAUNCHER"/> </intent-filter> </activity> </application> </manifest>' > app/src/main/AndroidManifest.xml echo '<resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>' > app/src/main/res/values/styles.xml cat > app/src/main/java/com/stickman/game/MainActivity.java <<'JAVA' package com.stickman.game; import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebSettings; import android.view.View; public class MainActivity extends Activity { @Override protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); getWindow().getDecorView().setSystemUiVisibility( View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY ); WebView web = new WebView(this); WebSettings settings = web.getSettings(); settings.setJavaScriptEnabled(true); web.setBackgroundColor(0xff101827); setContentView(web); web.loadUrl("file:///android_asset/index.html"); } } JAVA - name: Build APK run: | gradle --no-daemon assembleDebug - name: Upload APK uses: actions/upload-artifact@v4 with: name: Stickman-Gun-Fight-APK path: app/build/outputs/apk/debug/app-debug.apk 
